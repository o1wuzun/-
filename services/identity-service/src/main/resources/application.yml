server:
  port: ${IDENTITY_PORT:8081}
spring:
  flyway:
    enabled: false
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:h2:file:./data/identity}
    username: sa
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
identity:
  private-key: ${IDENTITY_PRIVATE_KEY}
  public-key: ${IDENTITY_PUBLIC_KEY}
  admin-emails: ${IDENTITY_ADMIN_EMAILS:}
directory:
  groups: '${DIRECTORY_GROUPS:[{"id":"group-default","name":"算法基础学习组","description":"从二分查找与数据结构开始","proxy_path":"/groups/group-default"},{"id":"group-contest","name":"算法竞赛练习组","description":"分享比赛思路和解题经验","proxy_path":"/groups/group-contest"}]}'

notifications:
  enabled: ${NOTIFICATIONS_ENABLED:false}
  from: ${SMTP_FROM:}
